<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lucky Wheel Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* the Customize screen sets these (see applyLook) */
  :root {
    --font: 'Lilita One', 'Arial Black', sans-serif;
    --box-text: #ffffff;
    --box-outline: #111111;
    --tag-bg: #2b2b2b;
    --tag-text: #ffffff;
    --prize: #ffd23f;
    --pointer: #ff7a1a;
    --rim: #ffd23f;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vmin;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.2,1.4,.4,1);
  }
  #stage.show {
    opacity: 1;
    transform: scale(1);
  }
  #banner {
    max-width: 90vw;
    padding: 1.4vmin 4vmin;
    border-radius: 999px;
    background: var(--tag-bg);
    border: 0.6vmin solid var(--box-outline);
    box-shadow: 0 0.8vmin 0 var(--box-outline);
    color: var(--tag-text);
    font-size: 5vmin;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    -webkit-text-stroke: 0.25vmin var(--box-outline);
    paint-order: stroke fill;
  }
  #banner .user {
    color: var(--prize);
  }
  #wrap {
    position: relative;
    width: 74vmin;
    height: 74vmin;
  }
  #wheel {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 1vmin 2vmin rgba(0, 0, 0, 0.55));
  }
  #pointer {
    position: absolute;
    left: 50%;
    top: -3.2vmin;
    width: 8vmin;
    height: 10vmin;
    transform: translateX(-50%);
    transform-origin: 50% 20%;
    filter: drop-shadow(0 0.5vmin 0 var(--box-outline));
  }
  #pointer path, #gem .body { fill: var(--pointer); stroke: var(--box-outline); }
  #pointer circle { stroke: var(--box-outline); }
  #pointer.tick {
    animation: tick 0.12s ease-out;
  }
  @keyframes tick {
    50% { transform: translateX(-50%) rotate(-14deg); }
  }
  #result {
    position: absolute;
    left: 50%;
    top: 50%;
    min-width: 50vmin;
    max-width: 88vw;
    padding: 3vmin 5vmin;
    border-radius: 4vmin;
    background: var(--tag-bg);
    border: 0.8vmin solid var(--rim);
    box-shadow: 0 1vmin 0 var(--box-outline), 0 0 8vmin var(--rim);
    color: var(--tag-text);
    text-align: center;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.45s cubic-bezier(.2,1.6,.4,1);
  }
  #result.show {
    transform: translate(-50%, -50%) scale(1);
  }
  #result .who {
    font-size: 4.4vmin;
    color: var(--prize);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #result .won {
    font-size: 3.4vmin;
    opacity: 0.85;
    margin: 0.6vmin 0;
  }
  #result .prize {
    font-size: 8vmin;
    line-height: 1.05;
    color: var(--prize);
    -webkit-text-stroke: 0.3vmin var(--box-outline);
    paint-order: stroke fill;
  }
  #queue {
    min-height: 4vmin;
    color: var(--queue-color, #ffffff);
    font-size: var(--queue-size, 3.2vmin);
    -webkit-text-stroke: 0.2vmin var(--box-outline);
    paint-order: stroke fill;
  }
  #wheelView, #barView {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vmin;
  }
  [hidden] { display: none !important; }

  /* ---------- BAR STYLE (like LuckyWheel-Tool) ---------- */
  #barView { width: 100%; }
  #barTag {
    max-width: 80vw;
    padding: 1vmin 3.4vmin;
    border-radius: 1.6vmin;
    background: var(--tag-bg);
    border: 0.5vmin solid var(--box-outline);
    color: var(--tag-text);
    font-size: 5.6vmin;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 0.6vmin 0 var(--box-outline);
  }
  #barBox {
    position: relative;
    width: 94vmin;
    max-width: 96vw;
  }
  #gem {
    position: absolute;
    left: 50%;
    top: -3.4vmin;
    width: 5.4vmin;
    height: 7vmin;
    transform: translateX(-50%);
    z-index: 3;
    filter: drop-shadow(0 0.4vmin 0 var(--box-outline));
  }
  #gem.tick { animation: gem 0.12s ease-out; }
  @keyframes gem { 50% { transform: translateX(-50%) translateY(-0.8vmin); } }
  #track {
    position: relative;
    height: 21vmin;
    border-radius: 3vmin;
    background: #111;
    border: 0.7vmin solid #111;
    box-shadow: 0 0 0 0.5vmin #2b2b2b, 0 1vmin 2vmin rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  #strip {
    position: absolute;
    left: 0;
    top: 50%;
    display: flex;
    gap: 1.4vmin;
    padding: 0 1.4vmin;
    transform: translateY(-50%);
    will-change: transform;
  }
  .tile {
    flex: 0 0 auto;
    width: 17vmin;
    height: 17vmin;
    border-radius: 2vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1vmin;
    box-shadow: inset 0 0 0 0.45vmin rgba(255, 255, 255, 0.45), inset 0 -1.2vmin 0 rgba(0, 0, 0, 0.18);
    color: var(--box-text);
    text-align: center;
    text-transform: uppercase;
    line-height: 0.95;
    overflow-wrap: anywhere;
    -webkit-text-stroke: 0.55vmin var(--box-outline);
    paint-order: stroke fill;
    transition: transform 0.3s cubic-bezier(.2,1.6,.4,1), box-shadow 0.3s;
  }
  .tile.win {
    transform: scale(1.12);
    box-shadow: inset 0 0 0 0.6vmin #fff, 0 0 4vmin #fff;
    position: relative;
    z-index: 2;
  }
  #track .shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,0.55), transparent 22%, transparent 78%, rgba(0,0,0,0.55));
    z-index: 1;
  }
  #barWon {
    min-height: 9vmin;
    font-size: 6.6vmin;
    color: var(--prize);
    -webkit-text-stroke: 0.35vmin var(--box-outline);
    paint-order: stroke fill;
    transform: scale(0);
    transition: transform 0.4s cubic-bezier(.2,1.6,.4,1);
    text-align: center;
  }
  #barWon.show { transform: scale(1); }
  #mystery {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44vmin;
    height: 44vmin;
    margin: -22vmin 0 0 -22vmin;
    object-fit: contain;
    filter: drop-shadow(0 1vmin 2vmin rgba(0, 0, 0, 0.5));
    z-index: 5;
    display: none;
  }
  #mystery.show {
    display: block;
    animation: bounceIn 0.65s ease-out both;
  }
  #mystery.show.out { animation: bounceOut 0.35s ease-in both; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-12deg); }
    55% { transform: scale(1.18) rotate(4deg); }
    75% { transform: scale(0.92) rotate(-2deg); }
    90% { transform: scale(1.04) rotate(0deg); }
    100% { transform: scale(1); }
  }
  @keyframes bounceOut {
    0% { transform: scale(1); }
    35% { transform: scale(1.15); }
    100% { transform: scale(0); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- bounces in and out before the bar spins: the Coullsey Wheel logo from the wheel folder -->
  <img id="mystery" src="/logo" alt="">

  <div id="barView" hidden>
    <div id="barTag"></div>
    <div id="barBox">
      <svg id="gem" viewBox="0 0 54 70">
        <path class="body" d="M27 68 L4 26 L14 4 H40 L50 26 Z" stroke-width="5" stroke-linejoin="round"/>
        <path d="M14 8 H40 L46 24 H8 Z" fill="rgba(255, 255, 255, 0.35)"/>
      </svg>
      <div id="track"><div id="strip"></div><div class="shade"></div></div>
    </div>
    <div id="barWon"></div>
  </div>

  <div id="wheelView">
  <div id="banner"><span class="user"></span> <span class="action"></span></div>
  <div id="wrap">
    <canvas id="wheel" width="1200" height="1200"></canvas>
    <svg id="pointer" viewBox="0 0 80 100">
      <path d="M40 98 L8 30 A34 34 0 1 1 72 30 Z" fill="#ffd23f" stroke="#170726" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="40" cy="30" r="11" fill="#fff" stroke="#170726" stroke-width="5"/>
    </svg>
    <div id="result">
      <div class="who"></div>
      <div class="won">won</div>
      <div class="prize"></div>
    </div>
  </div>
  </div>
  <div id="queue"></div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const banner = document.getElementById('banner');
const pointer = document.getElementById('pointer');
const resultBox = document.getElementById('result');
const queueEl = document.getElementById('queue');

const SIZE = canvas.width;
const C = SIZE / 2;
const R = C - 30;
const TOP = -Math.PI / 2;

// ?preview = the copy shown on the Play screen: always visible, muted unless the Play screen unmutes it
const PREVIEW = new URLSearchParams(location.search).has('preview');
let previewSound = false;
let serverSettings = { sound: true, alwaysVisible: false };
let settings = serverSettings;
function applySettings(s) {
  serverSettings = s;
  settings = PREVIEW ? { ...s, alwaysVisible: true, sound: previewSound } : s;
  if (s.look) applyLook(s.look);
}

// ---------- look (fonts + colours from the Customize screen) ----------
let look = {
  font: 'Lilita One', fontFile: '', boxText: '#ffffff', boxOutline: '#111111',
  tagBg: '#2b2b2b', tagText: '#ffffff', prize: '#ffd23f', pointer: '#ff7a1a', rim: '#ffd23f',
  showPrize: true, prizeText: '{prize}!',
  showQueue: true, queueText: '{count} more spin{s} queued', queueColor: '#ffffff', queueSize: 3.2,
};
let fontStack = "'Lilita One', 'Arial Black', sans-serif";
const loadedFonts = new Set(['Lilita One']);

function applyLook(l) {
  look = { ...look, ...l };
  const root = document.documentElement.style;
  root.setProperty('--box-text', look.boxText);
  root.setProperty('--box-outline', look.boxOutline);
  root.setProperty('--tag-bg', look.tagBg);
  root.setProperty('--tag-text', look.tagText);
  root.setProperty('--prize', look.prize);
  root.setProperty('--pointer', look.pointer);
  root.setProperty('--rim', look.rim);
  root.setProperty('--queue-color', look.queueColor);
  root.setProperty('--queue-size', look.queueSize + 'vmin');
  setQueue(lastQueued);

  // an uploaded font file, or one of the built-in Google fonts
  let family = look.font;
  if (look.fontFile) {
    family = 'Wheel ' + look.fontFile.replace(/\.\w+$/, '').replace(/[^\w ]/g, '');
    if (!loadedFonts.has(family)) {
      const face = new FontFace(family, 'url("/fonts/' + encodeURIComponent(look.fontFile) + '")');
      document.fonts.add(face);
      face.load().catch(() => {});
      loadedFonts.add(family);
    }
  } else if (!loadedFonts.has(family)) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(family) + '&display=swap';
    document.head.appendChild(link);
    loadedFonts.add(family);
  }
  fontStack = "'" + family + "', 'Lilita One', 'Arial Black', sans-serif";
  root.setProperty('--font', fontStack);
  // redraw the wheel once the font has arrived (canvas text doesn't update by itself)
  document.fonts.load("64px '" + family + "'").then(() => drawWheel(), () => {});
  drawWheel();
}

// ---------- box photos ----------
const photos = new Map();
function photo(name) {
  if (!name) return null;
  if (!photos.has(name)) {
    const img = new Image();
    img.onload = () => drawWheel();
    img.src = '/images/' + encodeURIComponent(name);
    photos.set(name, img);
  }
  const img = photos.get(name);
  return img.complete && img.naturalWidth ? img : null;
}
function photoUrl(name) {
  return 'url("/images/' + encodeURIComponent(name) + '")';
}

applySettings(settings);
let wheel = null;
let rotation = 0;
let animId = 0;
let hideTimer = null;
let spinning = false;

// ---------- drawing ----------
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt * 255)));
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}

function sliceFill(slice, a0, a1) {
  if (slice.style === 'rainbow') {
    const g = ctx.createConicGradient ? ctx.createConicGradient(a0, C, C) : null;
    if (g) {
      const span = (a1 - a0) / (Math.PI * 2);
      ['#ff2b2b', '#ffb000', '#f7ff00', '#2bff4a', '#00c8ff', '#7a2bff', '#ff2bd6'].forEach((c, i, arr) => g.addColorStop(Math.min(1, (i / (arr.length - 1)) * span), c));
      return g;
    }
    return '#ff2bd6';
  }
  const g = ctx.createRadialGradient(C, C, R * 0.1, C, C, R);
  g.addColorStop(0, shade(slice.color, 0.18));
  g.addColorStop(1, shade(slice.color, -0.12));
  return g;
}

function drawWheel() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  if (!wheel || !wheel.slices.length) return;
  const n = wheel.slices.length;
  const seg = (Math.PI * 2) / n;

  // outer rim
  ctx.beginPath();
  ctx.arc(C, C, R + 22, 0, Math.PI * 2);
  ctx.fillStyle = look.boxOutline;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(C, C, R + 12, 0, Math.PI * 2);
  ctx.fillStyle = look.rim;
  ctx.fill();

  const fontSize = Math.max(18, Math.min(64, Math.floor((R * seg) * 0.55), Math.floor(900 / Math.max(6, n))));
  wheel.slices.forEach((slice, i) => {
    const a0 = rotation + i * seg;
    const a1 = a0 + seg;
    ctx.beginPath();
    ctx.moveTo(C, C);
    ctx.arc(C, C, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = sliceFill(slice, a0, a1);
    ctx.fill();

    if (slice.style === 'ring') {
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = shade(slice.color, -0.28);
      ctx.lineWidth = R * 0.035;
      for (let r = R * 0.18; r < R; r += R * 0.11) {
        ctx.beginPath();
        ctx.arc(C, C, r, a0, a1);
        ctx.stroke();
      }
      ctx.restore();
    }

    // photo: sits near the rim, upright and pointing outward (text moves inward to make room)
    const img = photo(slice.image);
    let textEnd = R - 26;
    if (img) {
      const mid = a0 + seg / 2;
      const showText = !slice.hideText;
      const dist = showText ? R * 0.8 : R * 0.62;
      const room = 2 * dist * Math.sin(seg / 2) * 0.9; // width of the slice at that distance
      const s = Math.min(room, showText ? R * 0.3 : R * 0.6);
      const k = Math.min(s / img.naturalWidth, s / img.naturalHeight);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(C, C);
      ctx.arc(C, C, R, a0, a1);
      ctx.closePath();
      ctx.clip();
      ctx.translate(C + Math.cos(mid) * dist, C + Math.sin(mid) * dist);
      ctx.rotate(mid + Math.PI / 2);
      ctx.drawImage(img, -img.naturalWidth * k / 2, -img.naturalHeight * k / 2, img.naturalWidth * k, img.naturalHeight * k);
      ctx.restore();
      textEnd = dist - s / 2 - 12;
    }

    ctx.strokeStyle = look.boxOutline;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(C, C);
    ctx.lineTo(C + Math.cos(a0) * R, C + Math.sin(a0) * R);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // label, reading outward from the centre
    if (!(img && slice.hideText)) {
      ctx.save();
      ctx.translate(C, C);
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      // long prizes shrink to fit first, and only get cut off if they're still too long
      const maxW = textEnd - R * 0.24;
      let size = fontSize;
      ctx.font = size + 'px ' + fontStack;
      while (ctx.measureText(slice.text).width > maxW && size > fontSize * 0.65) {
        size -= 1;
        ctx.font = size + 'px ' + fontStack;
      }
      let text = slice.text;
      while (ctx.measureText(text).width > maxW && text.length > 3) text = text.slice(0, -2) + '…';
      ctx.lineJoin = 'round';
      ctx.lineWidth = size * 0.25;
      ctx.strokeStyle = look.boxOutline;
      ctx.fillStyle = look.boxText;
      ctx.strokeText(text, textEnd, 0);
      ctx.fillText(text, textEnd, 0);
      ctx.restore();
    }
  });

  // rim studs
  for (let i = 0; i < n; i++) {
    const a = rotation + i * seg;
    ctx.beginPath();
    ctx.arc(C + Math.cos(a) * (R + 6), C + Math.sin(a) * (R + 6), 9, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = look.boxOutline;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // hub
  ctx.beginPath();
  ctx.arc(C, C, R * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = look.boxOutline;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(C, C, R * 0.17, 0, Math.PI * 2);
  const hub = ctx.createLinearGradient(C, C - R * 0.17, C, C + R * 0.17);
  hub.addColorStop(0, '#9b30ff');
  hub.addColorStop(1, '#ff2fd0');
  ctx.fillStyle = hub;
  ctx.fill();
  ctx.fillStyle = look.boxText;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let hubSize = 64;
  ctx.font = hubSize + 'px ' + fontStack;
  while (ctx.measureText(wheel.name.toUpperCase()).width > R * 0.3 && hubSize > 20) {
    hubSize -= 2;
    ctx.font = hubSize + 'px ' + fontStack;
  }
  ctx.lineWidth = hubSize * 0.2;
  ctx.strokeStyle = look.boxOutline;
  ctx.strokeText(wheel.name.toUpperCase(), C, C + 2);
  ctx.fillText(wheel.name.toUpperCase(), C, C + 2);
}

// ---------- sound ----------
let audio = null;
function beep(freq, dur, type, vol) {
  if (!settings.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + dur);
  } catch (e) {}
}
// Wheel Spin.mp3 and Ding.mp3 from the wheel folder; the beeps only play if a file is missing
const spinAudio = new Audio('/sounds/spin');
const dingAudio = new Audio('/sounds/ding');
spinAudio.loop = true;
spinAudio.preload = dingAudio.preload = 'auto';
spinAudio.load();
dingAudio.load();
let spinFileOk = true;
let dingFileOk = true;
spinAudio.addEventListener('error', () => { spinFileOk = false; });
dingAudio.addEventListener('error', () => { dingFileOk = false; });
let fadeTimer = null;

function startSpinSound() {
  clearInterval(fadeTimer);
  if (!settings.sound || !spinFileOk) return;
  spinAudio.volume = 1;
  spinAudio.currentTime = 0;
  spinAudio.play().catch(soundBlocked);
}

// A normal browser tab won't play sound until the page is clicked (OBS doesn't have this rule)
const soundHint = document.createElement('div');
soundHint.textContent = '🔊 Click here to turn the wheel sound on';
soundHint.style.cssText = 'position:fixed;left:50%;bottom:2vmin;transform:translateX(-50%);display:none;padding:1vmin 2.4vmin;border-radius:999px;background:#170726;color:#ffd23f;font:2.6vmin "Lilita One",sans-serif;border:0.4vmin solid #ffd23f;cursor:pointer;z-index:10';
document.body.appendChild(soundHint);
document.addEventListener('click', () => { soundHint.style.display = 'none'; });

function soundBlocked(err) {
  if (err && err.name === 'NotAllowedError' && !PREVIEW) soundHint.style.display = 'block';
}

function stopSpinSound() {
  clearInterval(fadeTimer);
  if (spinAudio.paused) return;
  // quick fade so it doesn't cut off with a click
  fadeTimer = setInterval(() => {
    spinAudio.volume = Math.max(0, spinAudio.volume - 0.2);
    if (spinAudio.volume <= 0) {
      clearInterval(fadeTimer);
      spinAudio.pause();
    }
  }, 30);
}

function tickSound() {
  if (!spinFileOk) beep(1400, 0.05, 'square', 0.05);
}

function winSound() {
  stopSpinSound();
  if (!settings.sound) return;
  if (dingFileOk) {
    dingAudio.currentTime = 0;
    dingAudio.play().catch(soundBlocked);
    return;
  }
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.35, 'triangle', 0.18), i * 110));
}

// ---------- ui ----------
function show() {
  clearTimeout(hideTimer);
  stage.classList.add('show');
}
function hideSoon() {
  if (settings.alwaysVisible) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => stage.classList.remove('show'), 300);
}
// the Customize screen's preview shows a sample queue line so its text/colour/size can be seen
let lastQueued = 0;
let sampleQueue = 0;
function setQueue(n) {
  lastQueued = n || 0;
  const count = lastQueued || sampleQueue;
  queueEl.textContent = count > 0 && look.showQueue
    ? look.queueText.replace(/\{count\}/g, count).replace(/\{s\}/g, count === 1 ? '' : 's')
    : '';
}

// the line that says what was won (Customize -> Text)
function prizeLine(p) {
  return look.prizeText
    .replace(/\{prize\}/g, p.wheel.slices[p.index].text)
    .replace(/\{user\}/g, p.userName || '')
    .replace(/\{wheel\}/g, p.wheel.name)
    .trim();
}
function setBanner(user, action) {
  banner.querySelector('.user').textContent = user;
  banner.querySelector('.action').textContent = action;
}

function idleWheel(w) {
  if (spinning || !w) return;
  wheel = w;
  setMode(w);
  if (isBar(w)) idleBar(w);
  else drawWheel();
  if (settings.alwaysVisible) {
    setBanner('', 'Spin the ' + w.name + ' wheel!');
    show();
  } else {
    stage.classList.remove('show');
  }
}

// ---------- bar style ----------
const wheelView = document.getElementById('wheelView');
const barView = document.getElementById('barView');
const barTag = document.getElementById('barTag');
const barWon = document.getElementById('barWon');
const strip = document.getElementById('strip');
const track = document.getElementById('track');
const gem = document.getElementById('gem');
const mystery = document.getElementById('mystery');
let introTimer = null;
let outTimer = null;

function isBar(w) { return !!w && w.display === 'bar'; }

function setMode(w) {
  wheelView.hidden = isBar(w);
  barView.hidden = !isBar(w);
}

function tileCss(s) {
  if (s.style === 'rainbow') return 'conic-gradient(from 200deg, #ff2b2b, #ffb000, #f7ff00, #2bff4a, #00c8ff, #7a2bff, #ff2bd6, #ff2b2b)';
  if (s.style === 'ring') return 'repeating-radial-gradient(circle, ' + shade(s.color, 0.1) + ' 0 1.6vmin, ' + shade(s.color, -0.22) + ' 1.6vmin 2.6vmin)';
  return 'linear-gradient(180deg, ' + shade(s.color, 0.12) + ', ' + shade(s.color, -0.08) + ')';
}

function makeTile(s) {
  const t = document.createElement('div');
  t.className = 'tile';
  // a photo covers the box, with the box colour showing through any transparent parts
  t.style.background = s.image ? photoUrl(s.image) + ' center / cover no-repeat, ' + tileCss(s) : tileCss(s);
  if (s.image && s.hideText) return t;
  // shrink for long text, and enough that the longest word never splits
  const len = s.text.length;
  const longest = Math.max(1, ...s.text.split(/\s+/).map(w => w.length));
  const size = Math.min(len > 12 ? 2.9 : len > 8 ? 3.4 : len > 5 ? 4.2 : 5, 15 / (0.62 * longest));
  t.style.fontSize = size.toFixed(2) + 'vmin';
  t.style.overflowWrap = 'normal';
  t.textContent = s.text;
  return t;
}

// Random numbers from the spin's seed: every screen (OBS, the preview) gets the same ones,
// so they all build the same strip and stop in the same spot
function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function spinRandom(p) {
  return seededRandom(p.seed ?? Math.floor(Math.random() * 4294967296));
}

function shuffled(n, rand) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// boxes in shuffled runs, so the strip looks random but every box shows up
function fillStrip(slices, count, rand = Math.random) {
  const seq = [];
  while (seq.length < count) seq.push(...shuffled(slices.length, rand));
  seq.length = count;
  strip.replaceChildren(...seq.map(i => makeTile(slices[i])));
}

function stripMetrics() {
  const tiles = strip.children;
  const last = tiles.length - 1;
  const w = tiles[0].offsetWidth;
  // averaged over the whole strip; only used for the tick sound, not for where it stops
  const pitch = last > 0 ? (tiles[last].offsetLeft - tiles[0].offsetLeft) / last : w;
  return { w, pitch, first: tiles[0].offsetLeft, center: track.clientWidth / 2 };
}

// strip x that puts tile `pos` under the gem
// Uses that box's real position: multiplying a rounded box width by the box number drifts
// by a box or more on long strips, and by a different amount at OBS's size than the preview's
function centerOn(pos, offset = 0) {
  const tile = strip.children[pos];
  return track.clientWidth / 2 - (tile.offsetLeft + tile.offsetWidth / 2) - offset;
}

function setStripX(x) {
  strip.style.transform = 'translate3d(' + x + 'px, -50%, 0)';
}

function idleBar(w) {
  // same order every time for the same wheel, so redrawing it doesn't make the boxes jump around
  let seed = 7;
  for (const ch of w.id + w.name) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  fillStrip(w.slices, Math.max(9, w.slices.length), seededRandom(seed));
  setStripX(centerOn(Math.floor(strip.children.length / 2)));
  barTag.textContent = 'Spin the ' + w.name + '!';
  barWon.classList.remove('show');
}

function startBarSpin(p) {
  const slices = p.wheel.slices;
  const count = Math.max(70, slices.length * 4);
  const target = count - 6;
  const rand = spinRandom(p);
  fillStrip(slices, count, rand);
  const stopOffset = rand() - 0.5; // where on the winning box the gem stops
  strip.children[target].replaceWith(makeTile(slices[p.index]));
  barTag.textContent = p.userName || p.wheel.name;
  barWon.classList.remove('show');
  setStripX(centerOn(2));

  // logo bounces in and out first, then the bar scrolls - all inside the spin time
  const intro = Math.min(1400, p.spinMs * 0.25);
  const elapsed = Math.min(p.elapsedMs || 0, p.spinMs);

  const run = () => {
    mystery.classList.remove('show', 'out');
    barView.style.visibility = '';
    startSpinSound();
    const m = stripMetrics();
    const startX = centerOn(2);
    const endX = centerOn(target, stopOffset * m.w * 0.4);
    const dur = p.spinMs - intro;
    const began = performance.now() - Math.max(0, elapsed - intro);
    let last = null;
    function frame(now) {
      const t = Math.min(1, (now - began) / dur);
      const x = startX + (endX - startX) * easeOut(t);
      setStripX(x);
      const under = Math.floor((m.center - x - m.first) / m.pitch);
      if (last !== null && under !== last) {
        tickSound();
        gem.classList.remove('tick');
        void gem.getBoundingClientRect();
        gem.classList.add('tick');
      }
      last = under;
      if (t < 1) animId = requestAnimationFrame(frame);
      else finishBar(p, target);
    }
    animId = requestAnimationFrame(frame);
  };

  if (elapsed < intro) {
    // logo bounces in, then bounces out just as the bar appears
    barView.style.visibility = 'hidden';
    mystery.classList.add('show');
    outTimer = setTimeout(() => mystery.classList.add('out'), Math.max(0, intro - elapsed - 350));
    introTimer = setTimeout(run, intro - elapsed);
  } else {
    run();
  }
}

function finishBar(p, target) {
  strip.children[target].classList.add('win');
  barWon.textContent = prizeLine(p);
  if (look.showPrize) barWon.classList.add('show');
  winSound();
}

// ---------- spin ----------
function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

function startSpin(p) {
  cancelAnimationFrame(animId);
  clearTimeout(introTimer);
  clearTimeout(outTimer);
  clearTimeout(demoTimer);
  stopSpinSound();
  mystery.classList.remove('show', 'out');
  spinning = true;
  wheel = p.wheel;
  if (p.settings) applySettings(p.settings);
  setMode(wheel);
  if (isBar(wheel)) {
    setQueue(p.queued);
    show();
    startBarSpin(p);
    return;
  }
  const n = wheel.slices.length;
  const seg = (Math.PI * 2) / n;

  resultBox.classList.remove('show');
  setBanner(p.userName, (p.userName ? 'is spinning' : 'Spinning') + ' the ' + wheel.name + ' wheel!');
  setQueue(p.queued);
  show();

  // land the chosen slice under the pointer, slightly off-centre so it feels natural
  const jitter = (spinRandom(p)() - 0.5) * seg * 0.6;
  const want = TOP - (p.index + 0.5) * seg + jitter;
  const start = rotation % (Math.PI * 2);
  let delta = (want - start) % (Math.PI * 2);
  if (delta < 0) delta += Math.PI * 2;
  const turns = Math.max(3, Math.round(p.spinMs / 1000));
  const end = start + delta + turns * Math.PI * 2;

  const began = performance.now() - Math.min(p.elapsedMs || 0, p.spinMs);
  let lastSlice = null;
  startSpinSound();

  function frame(now) {
    const t = Math.min(1, (now - began) / p.spinMs);
    rotation = start + (end - start) * easeOut(t);
    drawWheel();
    const under = Math.floor((((TOP - rotation) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / seg);
    if (lastSlice !== null && under !== lastSlice) {
      tickSound();
      pointer.classList.remove('tick');
      void pointer.offsetWidth;
      pointer.classList.add('tick');
    }
    lastSlice = under;
    if (t < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      finish(p);
    }
  }
  animId = requestAnimationFrame(frame);
}

function finish(p) {
  const slice = p.wheel.slices[p.index];
  // no username (manual spin) = just show the prize
  resultBox.querySelector('.who').textContent = p.userName;
  resultBox.querySelector('.who').hidden = !p.userName;
  resultBox.querySelector('.won').hidden = !p.userName;
  resultBox.querySelector('.prize').textContent = prizeLine(p);
  if (look.showPrize) resultBox.classList.add('show');
  setBanner(p.userName, (p.userName ? 'landed on ' : 'Landed on ') + slice.text + '!');
  winSound();
}

function endSpin(queued) {
  spinning = false;
  resultBox.classList.remove('show');
  barWon.classList.remove('show');
  setQueue(queued);
  if (queued > 0) return; // next spin is about to start, stay on screen
  hideSoon();
  if (settings.alwaysVisible) {
    setBanner('', 'Spin the ' + wheel.name + ' wheel!');
    barTag.textContent = 'Spin the ' + wheel.name + '!';
  }
}

// ---------- events from the server ----------
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    applySettings(d.settings);
    setQueue(d.queued);
    idleWheel(d.wheel);
  });
  es.addEventListener('settings', e => {
    const d = JSON.parse(e.data);
    applySettings({ sound: d.sound, alwaysVisible: d.alwaysVisible, look: d.look });
    idleWheel(d.wheel);
  });
  es.addEventListener('spin', e => startSpin(JSON.parse(e.data)));
  es.addEventListener('idle', e => endSpin(JSON.parse(e.data).queued));
  es.addEventListener('queue', e => setQueue(JSON.parse(e.data).queued));
  // the browser gives up for good on some errors (e.g. while the wheel restarts) - keep trying
  es.onerror = () => {
    if (es.readyState !== EventSource.CLOSED) return;
    es.close();
    setTimeout(connect, 2000);
  };
}

// The Play / Customize screens tell the preview which wheel to show, unsaved look changes,
// and ask for demo spins (these only happen in the preview - no rewards, nothing on OBS)
let demoTimer = null;
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.showWheel) idleWheel(e.data.showWheel);
  if (PREVIEW && e.data.look) applyLook(e.data.look);
  if (PREVIEW && 'sampleQueue' in e.data) {
    sampleQueue = Number(e.data.sampleQueue) || 0;
    setQueue(lastQueued);
  }
  if (PREVIEW && e.data.demoSpin && !spinning) {
    const p = e.data.demoSpin;
    startSpin(p);
    demoTimer = setTimeout(() => endSpin(0), p.spinMs + p.resultMs + 600);
  }
  if (PREVIEW && 'previewSound' in e.data) {
    previewSound = !!e.data.previewSound;
    applySettings(serverSettings);
    if (!settings.sound) stopSpinSound();
  }
});

document.fonts && document.fonts.load("64px 'Lilita One'").finally(drawWheel);
connect();
</script>
</body>
</html>
